<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉尔吉斯斯坦新闻聚合 | AI智能分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Roboto, 'Noto Sans', sans-serif;
            background: #f5f7fb;
            color: #1a2a3a;
            line-height: 1.6;
        }

        /* 头部 */
        .header {
            background: linear-gradient(135deg, #1a4731 0%, #2d6a4f 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header h1 span {
            font-size: 2rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .header .update-time {
            margin-top: 1rem;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 30px;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* 日期选择器 */
        .date-picker {
            background: white;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .date-control {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .date-control label {
            font-weight: 600;
            color: #2d6a4f;
        }

        #date-select {
            padding: 0.5rem 1rem;
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            background: white;
            cursor: pointer;
        }

        .refresh-btn {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #1a4731;
        }

        /* 新闻内容区域 */
        .news-content {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        .news-content h1 {
            font-size: 1.8rem;
            color: #1a4731;
            border-bottom: 3px solid #f0b27a;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .news-content h2 {
            font-size: 1.4rem;
            color: #2d6a4f;
            margin: 1.5rem 0 1rem 0;
            padding-left: 0.8rem;
            border-left: 4px solid #f0b27a;
        }

        .news-content h3 {
            font-size: 1.2rem;
            color: #1a2a3a;
            margin: 1.2rem 0 0.5rem 0;
        }

        .news-content p {
            margin: 0.8rem 0;
            color: #3a4a5a;
        }

        .news-content a {
            color: #2d6a4f;
            text-decoration: none;
            border-bottom: 1px dashed #2d6a4f;
        }

        .news-content a:hover {
            color: #f0b27a;
            border-bottom-color: #f0b27a;
        }

        .news-content ul, .news-content ol {
            margin: 0.8rem 0 0.8rem 1.8rem;
        }

        .news-content blockquote {
            background: #f8f9fa;
            border-left: 4px solid #f0b27a;
            padding: 0.5rem 1rem;
            margin: 1rem 0;
            color: #5a6a7a;
        }

        .no-content {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 3rem;
            color: #2d6a4f;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: #8a9aaa;
            font-size: 0.8rem;
            border-top: 1px solid #e0e8f0;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .news-content {
                padding: 1rem;
            }
            .news-content h1 {
                font-size: 1.4rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <span>🇰🇬</span> 吉尔吉斯斯坦新闻聚合
        </h1>
        <p>AI 智能分析 · 每日新闻摘要</p>
        <div class="update-time" id="update-time">加载中...</div>
    </div>

    <div class="container">
        <div class="date-picker">
            <div class="date-control">
                <label>📅 选择日期：</label>
                <select id="date-select">
                    <option value="">加载中...</option>
                </select>
            </div>
            <button class="refresh-btn" id="refresh-btn">🔄 刷新</button>
        </div>

        <div class="news-content" id="news-content">
            <div class="loading">📰 正在加载新闻日报...</div>
        </div>
    </div>

    <div class="footer">
        🇰🇬 数据来源：Kabar.kg · 24.kg · AKIpress · VB.KG · Kaktus.media<br>
        🤖 AI 分析：DeepSeek · 每日自动更新
    </div>

    <script>
        // 获取所有日报文件的列表（通过 GitHub API）
        async function getAvailableDates() {
            try {
                const response = await fetch('https://api.github.com/repos/keszhongjiandong-dotcom/ai-daily-digest/contents/daily');
                if (response.ok) {
                    const files = await response.json();
                    const dates = files
                        .filter(f => f.name.endsWith('.md'))
                        .map(f => f.name.replace('.md', ''))
                        .sort()
                        .reverse();
                    return dates;
                }
            } catch (e) {
                console.error('获取文件列表失败:', e);
            }
            return [];
        }

        // 加载指定的日报
        async function loadDaily(date) {
            if (!date) return;
            
            const contentDiv = document.getElementById('news-content');
            contentDiv.innerHTML = '<div class="loading">📖 正在加载新闻...</div>';
            
            try {
                const url = `https://raw.githubusercontent.com/keszhongjiandong-dotcom/ai-daily-digest/main/daily/${date}.md`;
                const response = await fetch(url);
                
                if (response.ok) {
                    const markdown = await response.text();
                    contentDiv.innerHTML = renderMarkdown(markdown);
                    document.getElementById('update-time').innerHTML = `📅 ${date} · AI 智能分析`;
                } else {
                    contentDiv.innerHTML = '<div class="no-content">❌ 未找到该日期的新闻日报</div>';
                }
            } catch (e) {
                contentDiv.innerHTML = '<div class="no-content">❌ 加载失败，请稍后重试</div>';
            }
        }

        // 简单的 Markdown 渲染
        function renderMarkdown(md) {
            let html = md;
            
            // 标题
            html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
            html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
            html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
            
            // 粗体
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // 链接
            html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            
            // 无序列表
            html = html.replace(/^- (.*?)$/gm, '<li>$1</li>');
            html = html.replace(/<li>(.*?)<\/li>\n<li>/g, '<li>$1</li><li>');
            html = html.replace(/<li>(.*?)<\/li>(?:\n|$)/g, '<ul><li>$1</li></ul>');
            html = html.replace(/<\/ul><ul>/g, '');
            
            // 引用块
            html = html.replace(/^> (.*?)$/gm, '<blockquote>$1</blockquote>');
            
            // 分隔线
            html = html.replace(/^---$/gm, '<hr>');
            
            // 段落
            html = html.replace(/^(?!<[a-z]|$)(.*?)$/gm, '<p>$1</p>');
            
            // 清理多余的 p 标签
            html = html.replace(/<p><\/([a-z]+)>/g, '</$1>');
            html = html.replace(/<\/([a-z]+)><p>/g, '</$1><p>');
            
            // 换行转为 br
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }

        // 初始化日期选择器
        async function initDatePicker() {
            const dates = await getAvailableDates();
            const select = document.getElementById('date-select');
            
            if (dates.length === 0) {
                select.innerHTML = '<option value="">暂无日报</option>';
                document.getElementById('news-content').innerHTML = '<div class="no-content">📭 暂无新闻日报，请先运行工作流生成</div>';
                return;
            }
            
            let options = '';
            for (const date of dates) {
                options += `<option value="${date}">${date}</option>`;
            }
            select.innerHTML = options;
            
            // 默认加载最新的日报
            const latestDate = dates[0];
            select.value = latestDate;
            loadDaily(latestDate);
        }

        // 刷新按钮
        document.getElementById('refresh-btn').addEventListener('click', () => {
            const selectedDate = document.getElementById('date-select').value;
            if (selectedDate) {
                loadDaily(selectedDate);
            }
        });

        // 日期切换
        document.getElementById('date-select').addEventListener('change', (e) => {
            if (e.target.value) {
                loadDaily(e.target.value);
            }
        });

        // 启动
        initDatePicker();
    </script>
</body>
</html>
